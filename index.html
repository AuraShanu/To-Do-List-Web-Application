<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My To-Do List</title>

    <!-- Bootstrap 5 CSS (CDN) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">My To-Do List</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-5">
        <div class="container d-flex justify-content-center">
            <div class="card todo-card shadow-sm w-100" style="max-width: 600px;">
                <div class="card-body">

                    <!-- Page Heading -->
                    <h3 class="card-title text-center mb-1">Task Manager</h3>
                    <p class="text-muted text-center mb-4">
                        Organize your tasks and stay productive.
                    </p>

                    <!-- Input Field + Add Task Button -->
                    <div class="input-group mb-3">
                        <input
                            type="text"
                            id="taskInput"
                            class="form-control"
                            placeholder="Enter a new task..."
                            aria-label="New task"
                        />
                        <button class="btn btn-primary" id="addTaskBtn">
                            Add Task
                        </button>
                    </div>

                    <!-- Error Message (validation) -->
                    <div id="errorMsg" class="text-danger small mb-2 d-none">
                        Please enter a task.
                    </div>

                    <!-- Filter Buttons + Task Counter -->
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <!-- Your tasks label -->
                        <span class="text-muted small">Your tasks</span>

                        <!-- Counter badge -->
                        <span class="badge bg-secondary" id="taskCounter">
                            0 remaining
                        </span>
                    </div>

                    <div class="btn-group w-100 mb-3" role="group" aria-label="Filters">
                        <button type="button" class="btn btn-outline-primary active" data-filter="all">
                            All
                        </button>
                        <button type="button" class="btn btn-outline-primary" data-filter="active">
                            Active
                        </button>
                        <button type="button" class="btn btn-outline-primary" data-filter="completed">
                            Completed
                        </button>
                    </div>

                    <!-- Task List -->
                    <ul class="list-group mb-3" id="taskList">
                        <!-- JavaScript එකෙන් list items add වෙයි -->
                    </ul>

                    <!-- Clear Completed Button -->
                    <div class="d-flex justify-content-end">
                        <button class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">
                            Clear Completed
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle (CDN) -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
